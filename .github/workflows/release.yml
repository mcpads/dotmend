name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      replace_existing:
        description: Replace the existing release for the current package version from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  MACOSX_DEPLOYMENT_TARGET: '26.0'

jobs:
  verify:
    if: github.event.repository.private == false && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && inputs.replace_existing))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require a release version from main
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPLACE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.replace_existing }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Use an approved release version'
          tag = f'v{version}'
          if os.environ['REPLACE_RELEASE'] != 'true':
              assert os.environ['TAG'] == tag, 'Tag must match Cargo.toml'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
          TAG=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$REPLACE_RELEASE" = true ]; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = false
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists; do not replace its artifacts.' >&2
            exit 1
          fi

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and verify the packaged MCP executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "$TARGET"
          python scripts/package_release.py "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, test, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
      REPLACE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.replace_existing }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Preserve the previous release before replacement
        if: env.REPLACE_RELEASE == 'true'
        run: |
          mkdir previous
          gh release view "$TAG" --json name,body,tagName,targetCommitish,isDraft,isPrerelease,isImmutable > previous/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > previous/tag.json
          gh release download "$TAG" --dir previous
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.REPLACE_RELEASE == 'true'
        with:
          name: previous-release
          path: previous/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish the verified binaries and checksums
        env:
          RELEASE_NOTES: 'Native MCP server for Windows, macOS, and Linux. Give your agent https://github.com/mcpads/dotmend and ask it to follow INSTALL.md. Agents briefly explain the available human controls and the one-stroke Undo limit when sharing the screen. Requires stateless MCP 2026-07-28. The browser interface and editing guide are embedded in each executable. SHA256SUMS covers all binary archives.'
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          if [ "$REPLACE_RELEASE" = true ]; then
            gh release edit "$TAG" --draft=true
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f message="Dotmend ${TAG#v}" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$tag_object" -F force=true >/dev/null
            gh release upload "$TAG" --clobber -- ./*.tar.gz ./*.zip SHA256SUMS
            gh release edit "$TAG" --draft=false --latest --verify-tag \
              --target "$GITHUB_SHA" --title "Dotmend ${TAG#v}" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" --verify-tag --title "Dotmend ${TAG#v}" \
              --notes "$RELEASE_NOTES" --latest -- ./*.tar.gz ./*.zip SHA256SUMS
          fi
