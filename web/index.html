<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dotmend</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><span class="brand">▦ Dotmend</span><div class="actions"><button id="mark" disabled aria-pressed="false" title="Mark pixels for your agent">Mark issues</button><button id="undo" disabled title="Undo · Ctrl / ⌘ Z" aria-keyshortcuts="Control+Z Meta+Z"><span aria-hidden="true">↶</span> Undo</button><button id="save" class="primary" disabled title="Save · Ctrl / ⌘ S" aria-keyshortcuts="Control+S Meta+S">Save</button></div></header>
<main><div class="heading"><h1 id="title">Waiting for artwork.</h1><p id="note">Tell your agent what you want to see.</p><p id="hint" hidden>Choose a color, then click the pixels you want to change.</p></div><div id="pictures" class="pictures"></div></main>
<footer><span id="status" role="status" aria-live="polite"></span></footer>
</body>
</html>
