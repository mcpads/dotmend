[package]
name = "dotmend"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[features]
default = ["native"]
native = ["dep:rmcp", "dep:tokio", "dep:tempfile", "dep:rusqlite", "dep:axum", "dep:base64", "dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
png = "0.18"
rmcp = { version = "3.2", optional = true, default-features = false, features = ["server", "transport-io", "base64"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
tempfile = { version = "3", optional = true }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }

reqwest = { version = "0.13", optional = true, default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dotmend"
required-features = ["native"]

[lints.rust]
unsafe_code = "forbid"
